<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}AI Sentiment Analyzer{% endblock %}</title>
  <meta name="description" content="Analyze reviews and social posts for sentiment with a fine-tuned RoBERTa transformer." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%236e56cf'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='white'>🧠</text></svg>" />
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a class="nav-logo" href="/"><span class="dot">SA</span> Sentiment Analyzer</a>
      <nav class="nav-links">
        <a href="#analyzer">Analyzer</a>
        <a href="#dashboard-section">Dashboard</a>
        <a href="#history-section">History</a>
        <a href="/#analyzer" class="nav-cta">Try it free</a>
      </nav>
    </div>
  </header>

  {% block hero %}{% endblock %}

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="footer">
    <div class="footer-inner">
      <p>© 2026 AI Sentiment Analyzer.</p>
      <div class="stack">
        <span>Python · Flask</span><span>Hugging Face Transformers</span><span>MongoDB</span><span>Chart.js</span>
      </div>
    </div>
  </footer>

  {% block scripts %}{% endblock %}
</body>
</html>
